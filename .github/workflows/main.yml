name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test the Fabric mod
        run: ./gradlew :mod:build :mod:test --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: modern-dungeons-guide
          path: mod/build/libs/*.jar
