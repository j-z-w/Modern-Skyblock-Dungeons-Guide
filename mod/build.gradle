    exclude "kr/syeyoung/dungeonsguide/mod/commands/CommandReparty.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/api/**"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/customgui/**"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/FeatureGoodParties.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/FeaturePartyList.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/FeaturePartyReady.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/playerpreview/datarenders/**"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/playerpreview/widget/**"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/playerpreview/FakePlayer.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/playerpreview/FeatureViewPlayerStatsOnJoin.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/playerpreview/HoverEventRenderPlayer.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/etc/FeatureAutoAcceptReparty.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/etc/FeatureRepartyCommand.java"
    // HoverEventActionMixin only registers the profile-viewer hover event action
    exclude "kr/syeyoung/dungeonsguide/mod/mixin/HoverEventActionMixin.java"
    // mixins whose events only excluded features listen to (ESP / nametags / penguins, cosmetics, explosion sound,
    // profile viewer hover); also dropped from dungeonsguide.mixins.json
    exclude "kr/syeyoung/dungeonsguide/mod/mixin/EntityRenderDispatcherMixin.java"
    exclude "kr/syeyoung/dungeonsguide/mod/mixin/ClientPacketListenerMixin.java"
    exclude "kr/syeyoung/dungeonsguide/mod/mixin/PlayerMixin.java"
    exclude "kr/syeyoung/dungeonsguide/mod/mixin/PlayerTabOverlayMixin.java"
    exclude "kr/syeyoung/dungeonsguide/mod/mixin/SoundManagerMixin.java"
