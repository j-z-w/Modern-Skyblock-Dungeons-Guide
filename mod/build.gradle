    exclude "kr/syeyoung/dungeonsguide/mod/dungeon/roomedit/**"
    exclude "kr/syeyoung/dungeonsguide/mod/fakeserver/**"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/advanced/FeatureRoomEdit.java"
    // built on the room editor's MPanel
    exclude "kr/syeyoung/dungeonsguide/mod/gui/elements/CompatLayer.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/playerpreview/datarenders/DataRendererEditor.java"
    // dungeon room collector, uploads 1.8.9 formats
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/etc/FeatureCollectDungeonRooms.java"

    // == Phase 1 port trim: secret-routing-only build. Exclude, don't delete ==
    // The dungeons.guide backend is dead (503), so everything that only exists to
    // talk to it, plus features unrelated to secret routing, is cut here.

    // DG backend comms: STOMP/websocket client, static-resource fetcher,
    // DG-player presence tracking, and their events
    exclude "kr/syeyoung/dungeonsguide/mod/stomp/**"
    exclude "kr/syeyoung/dungeonsguide/mod/wsresource/**"
    exclude "kr/syeyoung/dungeonsguide/mod/player/**"
    exclude "kr/syeyoung/dungeonsguide/mod/events/impl/StompConnectedEvent.java"
    exclude "kr/syeyoung/dungeonsguide/mod/events/impl/DGPlayerEvent.java"
    exclude "kr/syeyoung/dungeonsguide/mod/events/impl/DGPlayerJoinEvent.java"
    exclude "kr/syeyoung/dungeonsguide/mod/events/impl/DGPlayerQuitEvent.java"
    // uploads dungeon run results to the backend
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeatureCollectScore.java"

    // Discord RPC integration
    exclude "kr/syeyoung/dungeonsguide/mod/discord/**"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/discord/**"
    exclude "kr/syeyoung/dungeonsguide/mod/events/impl/DiscordUserInvitedEvent.java"
