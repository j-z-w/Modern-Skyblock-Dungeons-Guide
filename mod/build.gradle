// dead .gui/.native resources for the excluded groups above
sourceSets.main.resources {
    // first-run onboarding pages reference removed features
    exclude "assets/dungeonsguide/gui/onboarding/**"
    // diagnostics/collector approval prompts
    exclude "assets/dungeonsguide/gui/collect_diagnostic_approval.gui"
    exclude "assets/dungeonsguide/gui/collect_rooms_approval.gui"
    // excluded features' guis
    exclude "assets/dungeonsguide/gui/config/cosmetics/**"
    exclude "assets/dungeonsguide/gui/features/discord_invite/**"
    exclude "assets/dungeonsguide/gui/features/discord_online/**"
    exclude "assets/dungeonsguide/gui/features/discord_party/**"
    exclude "assets/dungeonsguide/gui/features/f7waypoints/**"
    exclude "assets/dungeonsguide/gui/features/map/**"
    exclude "assets/dungeonsguide/gui/features/party_finder/**"
    exclude "assets/dungeonsguide/gui/features/profile_viewer/**"
    exclude "assets/dungeonsguide/gui/features/roomedit/**"
    exclude "assets/dungeonsguide/gui/features/spiritleap/**"
    // waterboard native: only used by the excluded water puzzle solver
    exclude "native/**/waterboard.*"
    exclude "native/**/libwaterboard.*"
}

// client gametest: a separate mod on the dev classpath, never in the shipped jar.
// Run with :mod:runClient -Pdg.clientGametest=true
sourceSets {
    gametest
}
sourceSets.gametest.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
sourceSets.gametest.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
// dev classpath discovery loads it as its own mod via src/gametest/resources/fabric.mod.json
sourceSets.main.runtimeClasspath += sourceSets.gametest.output

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestAnnotationProcessor.extendsFrom annotationProcessor
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

loom {
    accessWidenerPath = file("src/main/resources/dungeonsguide.classtweaker")

    runs {
        client {
            ideConfigGenerated = true
            name = "Launch Dungeons Guide"
            runDir = '../runtime'
            property('devauth.enabled', (project.findProperty('dg.devauth') ?: 'true').toString())
            // -Pdg.mixinAudit=true applies all mixins eagerly at boot for verification
            if (project.findProperty('dg.mixinAudit') == 'true') {
                vmArg '-Dmixin.debug.audit=true'
            }
            // -Pdg.clientGametest=true runs the client gametest entrypoints, then exits
            if (project.findProperty('dg.clientGametest') == 'true') {
                vmArg '-Dfabric.client.gametest'
                vmArg '-Dfabric.client.gametest.modid=dungeonsguide-gametest'
            }
            // -Pdg.perfBenchmark=true runs the route-rendering benchmark scenario instead of the smoke test.
            // -Pdg.perfMode=neo|classic|both picks the engine workload; -Pdg.noopt=true disables all
            // optimizations (batching, memoization, caches) for the simulated-BEFORE measurement.
            if (project.findProperty('dg.perfBenchmark') == 'true') {
                vmArg '-Ddg.perf.benchmark=true'
                vmArg "-Ddg.perf.mode=${project.findProperty('dg.perfMode') ?: 'neo'}"
            }
            if (project.findProperty('dg.noopt') == 'true') {
                vmArg '-Ddg.nobatch=true'
                vmArg '-Ddg.nocache=true'
                vmArg '-Ddg.nomemo=true'
            }
            client()
        }
    }
}

ext.genOutputDir = layout.buildDirectory.dir("generated-resources").get().asFile
task generateVersionInfo {
    ext.outputFile = file("$genOutputDir/versionMeta.properties")
    outputs.file(outputFile)
    doLast {
        outputFile.text = "VERSION=${project.version}\nMANDATORY_VERSION=0"
    }
}
sourceSets.main.output.dir genOutputDir, builtBy: generateVersionInfo

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.named("test") {
    useJUnitPlatform()
    maxHeapSize = "6g"
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
    // -Pdg.configDir=... enables the precalculation integration test (T4)
    if (project.hasProperty("dg.configDir")) {
        systemProperty "dg.configDir", project.property("dg.configDir")
    }
    // -Pdg.precalcOut=... : where PrecalcReproductionTest writes .pfreq and looks for regenerated .pfres
    if (project.hasProperty("dg.precalcOut")) {
        systemProperty "dg.precalcOut", project.property("dg.precalcOut")
    }
    // -Pdg.precalcIds=id1,id2,... : which shipped precalculations PrecalcReproductionTest reproduces
    if (project.hasProperty("dg.precalcIds")) {
        systemProperty "dg.precalcIds", project.property("dg.precalcIds")
    }
    // -Pdg.remotePickaxeSpeed=... : canonical pickaxe speed used when a request configures no tools
    if (project.hasProperty("dg.remotePickaxeSpeed")) {
        systemProperty "dg.remotePickaxeSpeed", project.property("dg.remotePickaxeSpeed")
    }
    // -Pdg.diag.<name>=... : SmartRouteRegressionTest knobs (rooms, variant, sweep, tspDeadlineMs)
    project.properties.each { k, v ->
        if (k.startsWith("dg.diag.")) systemProperty k, v
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    // the port is compile error driven, show all of them
    options.compilerArgs += ["-Xmaxerrs", "100000"]
    // command arguments are matched to method parameters by name (CommandRegistrationHelper), like the platform branch
    options.compilerArgs += ["-parameters"]
}

signing {
    required(project.findProperty("dg.dosign") == "true")
    useGpgCmd()
    sign tasks.jar
}

artifacts {
    remappedMod(tasks.jar)
    unmappedMod(tasks.jar)
}
