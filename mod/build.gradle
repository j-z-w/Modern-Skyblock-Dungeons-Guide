    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeatureBoxSkelemaster.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeatureBoxStarMobs.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeatureDungeonDeaths.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeatureDungeonMilestone.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeatureDungeonScore.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeatureDungeonTotalCrypts.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeatureHideNameTags.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeaturePlayerESP.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeaturePressAnyKeyToCloseChest.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeatureWarnLowHealth.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/FeatureWatcherWarning.java"
    // map/ is per-file: BossfightRenderSettings stays for the kept
