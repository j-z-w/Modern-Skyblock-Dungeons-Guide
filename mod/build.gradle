    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/map/FeatureDungeonMap2.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/dungeon/map/MapConfiguration.java"
