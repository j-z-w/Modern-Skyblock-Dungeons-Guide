    exclude "kr/syeyoung/dungeonsguide/mod/dungeon/roomprocessor/bombdefuse/**"
    exclude "kr/syeyoung/dungeonsguide/mod/dungeon/roomprocessor/boxpuzzle/**"
    exclude "kr/syeyoung/dungeonsguide/mod/dungeon/roomprocessor/icefill/**"
    exclude "kr/syeyoung/dungeonsguide/mod/dungeon/roomprocessor/waterpuzzle/**"
