    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/etc/FeatureCopyMessages.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/etc/FeatureDecreaseExplosionSound.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/etc/FeatureDisableMessage.java"
